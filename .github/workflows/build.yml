name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:github
        env:
          VITE_PDF_BASE: ./books/
      - uses: actions/upload-artifact@v4
        with:
          name: sanctus-oratio
          path: dist
