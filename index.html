<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanctus Oratio</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Lora', 'serif'],
              display: ['Cinzel', 'serif'],
            },
            colors: {
              gold: {
                50: '#FBF8E6',
                100: '#F6EFCD',
                200: '#EBE09B',
                300: '#E0D069',
                400: '#D5C137',
                500: '#CBAF15', // Main Gold
                600: '#A28C11',
                700: '#7A690D',
                800: '#514608',
                900: '#292304',
              },
              stone: {
                850: '#1c1917',
                950: '#0c0a09',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0c0a09; 
        background-image: radial-gradient(#292524 1px, transparent 1px);
        background-size: 24px 24px;
        transition: background-color 0.3s ease;
      }
      .light body {
        background-color: #f5f5f4; 
        background-image: radial-gradient(#e7e5e4 1px, transparent 1px);
      }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .animate-fade-in { animation: fadeIn .5s ease-out both; }
      @media (prefers-reduced-motion: reduce) { .animate-fade-in { animation: none; } }

      /* ===== Polish layer: gradients (all sizes) ===== */
      ::selection { background: rgba(203,175,21,.35); }
      html, body { overflow-x: hidden; }
      img, svg, video, canvas { max-width: 100%; }
      main {
        background-image:
          radial-gradient(1100px 560px at 8% -8%, rgba(203,175,21,.13), transparent 60%),
          radial-gradient(900px 600px at 100% 4%, rgba(124,58,237,.10), transparent 58%),
          radial-gradient(900px 700px at 50% 118%, rgba(14,165,233,.08), transparent 60%);
      }
      html:not(.dark) main {
        background-image:
          radial-gradient(1100px 560px at 8% -8%, rgba(203,175,21,.16), transparent 60%),
          radial-gradient(900px 600px at 100% 4%, rgba(124,58,237,.07), transparent 58%),
          radial-gradient(900px 700px at 50% 118%, rgba(14,165,233,.07), transparent 60%);
      }
      aside { background-image: linear-gradient(180deg, rgba(203,175,21,.10), transparent 28%, transparent 70%, rgba(124,58,237,.08)); }
      [class*="rounded-[30px]"], [class*="rounded-[40px]"], [class*="rounded-[50px]"], [class*="rounded-[60px]"], [class*="rounded-[58px]"] {
        background-image: linear-gradient(145deg, rgba(203,175,21,.075), transparent 46%, rgba(124,58,237,.05));
      }
      .bg-stone-950[class*="rounded-["] {
        background-image: radial-gradient(900px 420px at 85% 0%, rgba(203,175,21,.14), transparent 60%), radial-gradient(800px 500px at 0% 100%, rgba(124,58,237,.14), transparent 60%);
      }
      button.bg-gold-500, a.bg-gold-500 {
        background-image: linear-gradient(135deg, #f0e08a 0%, #cbaf15 46%, #a28c11 100%);
        box-shadow: 0 10px 28px -12px rgba(203,175,21,.65);
      }
      button.bg-gold-500:hover, a.bg-gold-500:hover { filter: brightness(1.07); }
      .font-display.text-gold-500:not(:has(*)) {
        background-image: linear-gradient(100deg, #f6efcd 0%, #e0d069 28%, #cbaf15 60%, #a28c11 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
      }
      .h-px.bg-gold-500 { background-color: transparent; background-image: linear-gradient(90deg, transparent, #cbaf15, transparent); }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #cbaf15, #7a690d); border-radius: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }

      /* ===== Polish layer: phones only (desktop is untouched) ===== */
      @media (max-width: 767px) {
        .min-h-screen { min-height: 100dvh; }
        .h-\[calc\(100vh-140px\)\] { height: calc(100dvh - 130px) !important; }
        .min-h-\[calc\(100vh-120px\)\], .min-h-\[600px\] { min-height: 0 !important; }
        header.sticky { padding-top: max(0.75rem, env(safe-area-inset-top)); }

        .text-9xl { font-size: 3.1rem !important; line-height: 1 !important; }
        .text-8xl { font-size: 2.7rem !important; line-height: 1.02 !important; }
        .text-7xl { font-size: 2.4rem !important; line-height: 1.05 !important; }
        .text-6xl { font-size: 2.05rem !important; line-height: 1.08 !important; }
        .text-5xl { font-size: 1.8rem !important; line-height: 1.12 !important; }
        .text-4xl { font-size: 1.5rem !important; line-height: 1.18 !important; }
        .text-3xl { font-size: 1.3rem !important; line-height: 1.22 !important; }
        .text-2xl { font-size: 1.15rem !important; }
        .text-xl { font-size: 1.02rem !important; }
        h1, h2, h3 { overflow-wrap: anywhere; text-wrap: balance; }

        .tracking-\[0\.5em\], .tracking-\[0\.4em\], .tracking-\[0\.3em\] { letter-spacing: 0.2em !important; }
        .tracking-\[0\.25em\] { letter-spacing: 0.16em !important; }
        .tracking-widest { letter-spacing: 0.12em !important; }

        .p-24, .p-20, .p-16 { padding: 1.5rem !important; }
        .p-12, .p-10 { padding: 1.25rem !important; }
        .p-8 { padding: 1.15rem !important; }
        .px-16 { padding-left: 1.25rem !important; padding-right: 1.25rem !important; }
        .px-12, .px-10 { padding-left: 1.1rem !important; padding-right: 1.1rem !important; }
        .py-24, .py-20 { padding-top: 2.5rem !important; padding-bottom: 2.5rem !important; }
        .py-16 { padding-top: 2rem !important; padding-bottom: 2rem !important; }
        .pb-40 { padding-bottom: 7rem !important; }

        .space-y-24 > :not([hidden]) ~ :not([hidden]) { margin-top: 3rem !important; }
        .space-y-20 > :not([hidden]) ~ :not([hidden]), .space-y-16 > :not([hidden]) ~ :not([hidden]) { margin-top: 2.25rem !important; }
        .space-y-12 > :not([hidden]) ~ :not([hidden]), .space-y-10 > :not([hidden]) ~ :not([hidden]) { margin-top: 1.5rem !important; }
        .gap-20, .gap-16 { gap: 2rem !important; }
        .gap-12, .gap-10 { gap: 1.25rem !important; }

        .rounded-\[100px\], .rounded-\[80px\] { border-radius: 32px !important; }
        .rounded-\[60px\], .rounded-\[58px\], .rounded-\[50px\] { border-radius: 28px !important; }
        .rounded-\[40px\] { border-radius: 24px !important; }
        .rounded-\[30px\] { border-radius: 20px !important; }

        .w-\[600px\], .w-\[500px\] { width: 120vw !important; }
        .w-16.h-16, .w-20.h-20 { flex-shrink: 0; }
        button, [role="button"], a.rounded-full { min-height: 44px; }
        input, select, textarea { font-size: 16px !important; } /* stops iOS zoom-on-focus */
        table { display: block; max-width: 100%; overflow-x: auto; }
        pre, code { white-space: pre-wrap; overflow-wrap: anywhere; }
        main { overflow-x: clip; }
        .grid { min-width: 0; }
        .grid > * { min-width: 0; }
      }
    </style>
</head>
  <body class="text-stone-800 dark:text-stone-200 antialiased h-full transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
